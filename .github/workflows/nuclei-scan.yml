name: Nuclei Auto Scan

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: nuclei-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra targets.txt
        run: |
          if [ ! -f targets.txt ]; then
            echo "::error::Không tìm thấy targets.txt. DỪNG."
            exit 1
          fi
          COUNT=$(grep -cve '^\s*$' targets.txt || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::targets.txt rỗng. DỪNG."
            exit 1
          fi
          echo "Số mục tiêu: $COUNT"

      - name: Chuẩn hóa mục tiêu
        run: |
          python3 - << 'PYEOF'
          import ipaddress
          import re
          from urllib.parse import urlsplit, urlunsplit

          LABEL_RE = re.compile(r'^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')

          def la_hostname_hop_le(host):
              if not host or len(host) > 253:
                  return False
              host = host.rstrip('.')
              labels = host.split('.')
              if len(labels) < 2:
                  return False
              return all(LABEL_RE.match(label) for label in labels)

          def chuan_hoa(dong):
              dong = dong.strip()
              if not dong or dong.startswith('#'):
                  return None
              if '://' not in dong and ':' in dong and not dong.startswith('['):
                  try:
                      ip = ipaddress.ip_address(dong)
                      if isinstance(ip, ipaddress.IPv6Address):
                          dong = f'https://[{dong}]'
                  except ValueError:
                      pass
              if '://' not in dong:
                  dong = 'https://' + dong
              try:
                  parts = urlsplit(dong)
              except ValueError:
                  return None
              scheme = parts.scheme.lower()
              if scheme not in ('http', 'https'):
                  return None
              if parts.username is not None or parts.password is not None:
                  return None
              host = parts.hostname
              if not host:
                  return None
              try:
                  ip = ipaddress.ip_address(host)
                  if ip.is_loopback or ip.is_private or ip.is_reserved or ip.is_multicast:
                      return None
                  if isinstance(ip, ipaddress.IPv6Address):
                      host = f"[{host}]"
              except ValueError:
                  if not la_hostname_hop_le(host):
                      return None
              port = parts.port
              if (scheme == 'http' and port == 80) or (scheme == 'https' and port == 443):
                  port = None
              if parts.query or parts.fragment:
                  return None
              netloc = host if port is None else f"{host}:{port}"
              path = parts.path.rstrip('/') or '/'
              return urlunsplit((scheme, netloc, path, '', ''))

          ket_qua = []
          for i, line in enumerate(open('targets.txt', encoding='utf-8'), 1):
              s = line.strip()
              if not s or s.startswith('#'):
                  continue
              c = chuan_hoa(s)
              if c is None:
                  raise SystemExit(f"Mục tiêu sai dòng {i}: {line!r}")
              ket_qua.append(c)

          if not ket_qua:
              raise SystemExit("Không có mục tiêu hợp lệ")

          open('targets-clean.txt', 'w', encoding='utf-8').write('\n'.join(ket_qua) + '\n')
          print(f"Đã chuẩn hóa: {len(ket_qua)} mục tiêu")
          PYEOF

      - name: Cài đặt Nuclei
        uses: projectdiscovery/nuclei-action@v3
        with:
          version: 'v3.11.1'
          install-only: 'true'

      - name: Xác minh cài đặt
        run: |
          if ! command -v nuclei &> /dev/null; then
            echo "::error::Cài đặt Nuclei thất bại."
            exit 1
          fi
          nuclei -version

      - name: Chạy Nuclei
        run: |
          set +e
          nuclei -l targets-clean.txt \
            -severity critical,high,medium \
            -exclude-severity info,low,unknown \
            -rl 150 -c 50 -bs 25 -timeout 10 -retries 2 \
            -json-export nuclei-results.json \
            -stats > scan.log 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Nuclei thất bại với mã $EXIT_CODE"
            exit 1
          fi

          if [ ! -f nuclei-results.json ]; then
            echo "::error::Nuclei không tạo tệp kết quả"
            exit 1
          fi

          echo "Quét xong."

      - name: Tạo báo cáo
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          findings = []
          parse_errors = []

          if os.path.exists('nuclei-results.json'):
              with open('nuclei-results.json') as f:
                  for line_no, line in enumerate(f, 1):
                      if not line.strip():
                          continue
                      try:
                          findings.append(json.loads(line))
                      except json.JSONDecodeError as e:
                          parse_errors.append({"line": line_no, "error": str(e)})

          if parse_errors:
              raise SystemExit(f"Chuẩn hóa thất bại: {len(parse_errors)} bản ghi hỏng")

          valid = []
          seen = set()
          for f in findings:
              severity = f.get('info', {}).get('severity', '')
              if severity not in ('critical', 'high', 'medium'):
                  continue
              fp = (
                  f.get('template-id', '') + '|' +
                  f.get('host', '') + '|' +
                  f.get('matched-at', '')
              )
              if fp in seen:
                  continue
              seen.add(fp)
              valid.append({
                  'template': f.get('template-id', ''),
                  'name': f.get('info', {}).get('name', ''),
                  'severity': severity,
                  'host': f.get('host', ''),
                  'matched': f.get('matched-at', ''),
                  'description': f.get('info', {}).get('description', '')[:300]
              })

          now = datetime.now(timezone.utc).isoformat()
          report = f"""# BÁO CÁO LỖ HỔNG - {now}

## TỔNG QUAN

- Tổng số phát hiện: {len(findings)}
- Sau khi lọc: {len(valid)}

## LỖI CÓ GIÁ TRỊ

"""
          for i, f in enumerate(valid, 1):
              report += f"### {i}. {f['name']}\n\n"
              report += f"- **Mẫu:** {f['template']}\n"
              report += f"- **Mức độ:** {f['severity']}\n"
              report += f"- **Máy chủ:** {f['host']}\n"
              report += f"- **Khớp:** {f['matched']}\n"
              report += f"- **Mô tả:** {f['description']}\n\n---\n\n"

          open('report.md', 'w', encoding='utf-8').write(report)
          print(f"Đã tạo báo cáo với {len(valid)} lỗi")
          PYEOF

      - name: Tải báo cáo lên
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            report.md
            nuclei-results.json
            scan.log
          retention-days: 30
