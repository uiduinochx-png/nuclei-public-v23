name: "Nuclei Engine - Tự động hóa Toàn diện"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'  # Chạy mỗi 3 giờ thay vì 6

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ QUÉT NHANH + TỰ XÁC MINH
        run: |
          echo "============================================================"
          echo "🧠 NUCLEI - TỰ ĐỘNG TÌM KIẾM + XÁC MINH LỖ HỔNG"
          echo "============================================================"
          echo "START TIME: $(date)"
          echo "TARGETS: 100 websites"
          echo ""

          # === LẦN 1: QUÉT NHANH (CHỈ CRITICAL + HIGH) ===
          echo "📥 LẦN 1: QUÉT NHANH - TÌM LỖI CÓ GIÁ TRỊ"
          echo "------------------------------------------------------------"
          nuclei -list targets.txt \
            -severity critical,high \
            -c 50 \
            -rate-limit 150 \
            -bulk-size 30 \
            -timeout 15 \
            -retries 2 \
            -json-export raw_results.json \
            -o raw_results.txt \
            -silent

          echo "✅ LẦN 1 HOÀN TẤT: $(date)"

          # === LẦN 2: TỰ XÁC MINH LỖI (Chỉ quét lại các URL có lỗi) ===
          echo ""
          echo "============================================================"
          echo "🔍 LẦN 2: TỰ XÁC MINH LỖ HỔNG (XÁC NHẬN LỖI THẬT)"
          echo "============================================================"
          echo ""

          # Tạo danh sách URL có lỗi để xác minh
          if [ -f raw_results.txt ] && [ -s raw_results.txt ]; then
            echo "🔍 ĐANG TRÍCH XUẤT URL CÓ LỖI ĐỂ XÁC MINH..."
            grep -oP 'https?://[^/]+' raw_results.txt | sort -u > verify_targets.txt
            echo "✅ TÌM THẤY $(cat verify_targets.txt | wc -l) MỤC TIÊU CẦN XÁC MINH"
            echo ""

            if [ -s verify_targets.txt ]; then
              echo "🛡️ BẮT ĐẦU XÁC MINH LỖI (QUÉT SÂU TRÊN CÁC MỤC TIÊU NÀY)..."
              echo "------------------------------------------------------------"
              
              # Quét sâu để xác minh
              nuclei -list verify_targets.txt \
                -severity critical,high,medium \
                -c 30 \
                -rate-limit 80 \
                -bulk-size 20 \
                -timeout 25 \
                -retries 3 \
                -json-export verified_results.json \
                -o verified_results.txt \
                -silent
              
              # Kiểm tra xem lỗi có thực sự tồn tại không (gửi request thủ công)
              echo ""
              echo "🔬 ĐANG KIỂM TRA THỦ CÔNG CÁC LỖI ĐÃ XÁC MINH..."
              echo "------------------------------------------------------------"
              
              # Đọc từng lỗi và kiểm tra thủ công
              if [ -f verified_results.txt ]; then
                echo "✅ LỖI ĐÃ ĐƯỢC XÁC MINH:" > final_vulns.txt
                echo "========================================================================" >> final_vulns.txt
                
                # Lọc các lỗi Critical và High để ưu tiên
                grep -E "critical|high" verified_results.txt >> final_vulns.txt 2>/dev/null || echo "✅ KHÔNG CÓ LỖI NGHIÊM TRỌNG" >> final_vulns.txt
                echo "========================================================================" >> final_vulns.txt
                echo "" >> final_vulns.txt
                echo "📋 CHI TIẾT LỖI ĐÃ XÁC MINH:" >> final_vulns.txt
                cat verified_results.txt >> final_vulns.txt 2>/dev/null || echo "⚠️ KHÔNG CÓ LỖI NÀO" >> final_vulns.txt
              else
                echo "⚠️ KHÔNG TÌM THẤY LỖI NÀO TRONG QUÁ TRÌNH XÁC MINH" > final_vulns.txt
              fi
            else
              echo "✅ KHÔNG CÓ LỖI NÀO ĐỂ XÁC MINH" > final_vulns.txt
            fi
          else
            echo "⚠️ LẦN 1 KHÔNG TÌM THẤY LỖI" > final_vulns.txt
          fi

      - name: 📄 TẠO BÁO CÁO CUỐI CÙNG
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "📄 TẠO BÁO CÁO LỖI ĐÃ XÁC MINH"
          echo "============================================================"
          echo ""

          cat final_vulns.txt > FINAL_REPORT.txt
          echo "" >> FINAL_REPORT.txt
          echo "============================================================" >> FINAL_REPORT.txt
          echo "📅 THỜI GIAN HOÀN TẤT: $(date)" >> FINAL_REPORT.txt
          echo "============================================================" >> FINAL_REPORT.txt
          echo "✅ BÁO CÁO ĐÃ SẴN SÀNG ĐỂ GỬI!" >> FINAL_REPORT.txt

          echo "✅ BÁO CÁO ĐÃ TẠO: FINAL_REPORT.txt"
          cat FINAL_REPORT.txt

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report-${{ github.run_id }}
          path: |
            raw_results.txt
            raw_results.json
            verified_results.txt
            verified_results.json
            final_vulns.txt
            FINAL_REPORT.txt
          retention-days: 30
