name: "Nuclei Engine 24/7 Pro - Tối Ưu"

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: '🚀 CHẾ ĐỘ QUÉT'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast
          - deep
          - ultimate
  schedule:
    - cron: '0 */6 * * *'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🔥 NUCLEI SCAN - TỐI ƯU
        run: |
          echo "╔══════════════════════════════════════════════════════════════════════════════╗"
          echo "║     🧠 NUCLEI ENGINE 24/7 PRO - TỐI ƯU KIẾM TIỀN                       ║"
          echo "╚══════════════════════════════════════════════════════════════════════════════╝"
          echo ""
          
          # ===== CẤU HÌNH THEO CHẾ ĐỘ =====
          case "${{ github.event.inputs.scan_mode || 'fast' }}" in
            fast)
              CONCURRENCY=50
              BULK=30
              RATE=150
              TIMEOUT=15
              RETRIES=3
              echo "⚡ CHẾ ĐỘ NHANH - QUÉT LỖI PHỔ BIẾN"
              ;;
            deep)
              CONCURRENCY=30
              BULK=20
              RATE=80
              TIMEOUT=30
              RETRIES=5
              echo "🔍 CHẾ ĐỘ SÂU - QUÉT TOÀN DIỆN"
              ;;
            ultimate)
              CONCURRENCY=20
              BULK=15
              RATE=50
              TIMEOUT=45
              RETRIES=6
              echo "💀 CHẾ ĐỘ TỐI ĐA - QUÉT TỪNG NGÕ NGÁCH"
              ;;
          esac
          
          echo "🎯 TARGETS: $(cat targets.txt | wc -l) websites"
          echo "⚙️ CONCURRENCY: $CONCURRENCY"
          echo "⚙️ RATE LIMIT: $RATE"
          echo "⚙️ TIMEOUT: $TIMEOUT"
          echo ""

          # ===== QUÉT LỖI CÓ TIỀN (CRITICAL + HIGH) =====
          echo "🔥 QUÉT LỖI NGHIÊM TRỌNG (CRITICAL + HIGH)..."
          nuclei -list targets.txt \
            -severity critical,high \
            -c $CONCURRENCY \
            -rate-limit $RATE \
            -bulk-size $BULK \
            -timeout $TIMEOUT \
            -retries $RETRIES \
            -max-redirects 15 \
            -stats \
            -stats-interval 10 \
            -json-export critical_high.json \
            -o critical_high.txt \
            -no-interactsh \
            -silent \
            -no-color 2>&1 | tee scan.log

          # ===== QUÉT LỖI MEDIUM (VẪN CÓ TIỀN) =====
          echo ""
          echo "🟡 QUÉT LỖI TRUNG BÌNH (MEDIUM)..."
          nuclei -list targets.txt \
            -severity medium \
            -c $CONCURRENCY \
            -rate-limit $RATE \
            -bulk-size $BULK \
            -timeout $TIMEOUT \
            -retries $RETRIES \
            -max-redirects 15 \
            -json-export medium.json \
            -o medium.txt \
            -no-interactsh \
            -silent \
            -no-color 2>&1 | tee -a scan.log

          # ===== GỘP KẾT QUẢ =====
          echo ""
          echo "📊 GỘP KẾT QUẢ..."
          cat critical_high.txt medium.txt > results.txt 2>/dev/null || true
          
          # Gộp JSON
          echo '[' > results.json
          if [ -f critical_high.json ] && [ "$(cat critical_high.json)" != "null" ]; then
            cat critical_high.json >> results.json
          fi
          if [ -f medium.json ] && [ "$(cat medium.json)" != "null" ]; then
            if [ "$(cat critical_high.json)" != "null" ]; then
              echo ',' >> results.json
            fi
            cat medium.json >> results.json
          fi
          echo ']' >> results.json

      - name: 📊 BÁO CÁO CHI TIẾT - PHÂN LOẠI TIỀN
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════════════════════"
          echo "📋 BÁO CÁO KẾT QUẢ QUÉT - PHÂN LOẠI THEO GIÁ TRỊ"
          echo "════════════════════════════════════════════════════════════════════════════════"
          echo ""
          
          # === THỐNG KÊ ===
          TOTAL=$(cat results.txt 2>/dev/null | wc -l || echo 0)
          CRITICAL=$(grep -c "critical" results.txt 2>/dev/null || echo 0)
          HIGH=$(grep -c "high" results.txt 2>/dev/null || echo 0)
          MEDIUM=$(grep -c "medium" results.txt 2>/dev/null || echo 0)
          
          # === TÍNH BOUNTY ===
          BOUNTY_CRITICAL=$((CRITICAL * 5000))
          BOUNTY_HIGH=$((HIGH * 1000))
          BOUNTY_MEDIUM=$((MEDIUM * 200))
          TOTAL_BOUNTY=$((BOUNTY_CRITICAL + BOUNTY_HIGH + BOUNTY_MEDIUM))
          
          echo "📦 TỔNG LỖI: $TOTAL"
          echo ""
          echo "💰 PHÂN LOẠI THEO TIỀN:"
          echo "─────────────────────────────────────────"
          echo "🔥 CRITICAL: $CRITICAL lỗi × \$5,000 = \$$BOUNTY_CRITICAL"
          echo "⚡ HIGH: $HIGH lỗi × \$1,000 = \$$BOUNTY_HIGH"
          echo "🟡 MEDIUM: $MEDIUM lỗi × \$200 = \$$BOUNTY_MEDIUM"
          echo ""
          echo "💰 TỔNG BOUNTY TIỀM NĂNG: \$$TOTAL_BOUNTY"
          echo ""
          
          # === HIỂN THỊ TOP 10 LỖI CRITICAL/HIGH ===
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "🔥 TOP 10 LỖI CÓ GIÁ TRỊ CAO NHẤT:"
            echo "─────────────────────────────────────────"
            grep -E "critical|high" results.txt 2>/dev/null | head -10
          else
            echo "✅ KHÔNG CÓ LỖI CRITICAL/HIGH"
          fi
          
          echo ""
          echo "════════════════════════════════════════════════════════════════════════════════"

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report-${{ github.run_id }}
          path: |
            results.txt
            results.json
            critical_high.txt
            medium.txt
            scan.log
          retention-days: 14
