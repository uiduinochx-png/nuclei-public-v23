name: "🚀 NUCLEI ULTIMATE SCAN"

on:
  workflow_dispatch:
    inputs:
      custom_targets:
        description: '🎯 DANH SÁCH MỤC TIÊU (1 URL mỗi dòng)'
        required: false
        default: ''
      severity_level:
        description: '📊 MỨC ĐỘ LỖ HỔNG'
        required: false
        default: 'critical,high'
        type: choice
        options:
          - critical,high
          - critical,high,medium
          - critical,high,medium,low
          - critical,high,medium,low,info
  schedule:
    - cron: '0 */3 * * *'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest

    steps:
      - name: 📦 CÀI ĐẶT CÔNG CỤ
        run: |
          apt-get update -qq && apt-get install -y -qq \
            jq curl git python3 python3-pip \
            massdns dnsrecon dnsenum \
            nmap ffuf \
            && rm -rf /var/lib/apt/lists/*
          
          nuclei -update-templates -silent
          nuclei -templates-version
          
          mkdir -p /tmp/ultimate-templates
          git clone --depth 1 -q https://github.com/geeknik/nuclei-templates.git /tmp/ultimate-templates/geeknik 2>/dev/null || true
          git clone --depth 1 -q https://github.com/notnotnotveg/nuclei-templates.git /tmp/ultimate-templates/extra 2>/dev/null || true
          git clone --depth 1 -q https://github.com/random-robbie/nuclei-templates.git /tmp/ultimate-templates/random 2>/dev/null || true
          git clone --depth 1 -q https://github.com/projectdiscovery/nuclei-templates.git /tmp/ultimate-templates/official 2>/dev/null || true

      - name: 📋 CHUẨN BỊ DANH SÁCH MỤC TIÊU
        id: prepare_targets
        run: |
          if [ -n "${{ github.event.inputs.custom_targets }}" ]; then
            echo "${{ github.event.inputs.custom_targets }}" > targets.txt
          elif [ -f "targets.txt" ]; then
            echo "📂 SỬ DỤNG FILE targets.txt CÓ SẴN"
          else
            echo "https://app.launchdarkly.com" > targets.txt
            echo "https://events.launchdarkly.com" >> targets.txt
            echo "https://stream.launchdarkly.com" >> targets.txt
            echo "https://docs.launchdarkly.com" >> targets.txt
          fi
          
          sed -i '/^$/d' targets.txt
          sed -i 's/^[ \t]*//;s/[ \t]*$//' targets.txt
          sed -i 's/^\([^h]\)/https:\/\/\1/' targets.txt
          
          TARGET_COUNT=$(wc -l < targets.txt)
          echo "🎯 SỐ MỤC TIÊU: $TARGET_COUNT"
          echo "target_count=$TARGET_COUNT" >> $GITHUB_ENV

      - name: 🔍 CHẠY QUÉT NUCLEI
        timeout-minutes: 120
        run: |
          echo "⏰ BẮT ĐẦU: $(date)"
          echo "🎯 MỤC TIÊU: ${{ env.target_count }}"
          echo "📊 MỨC ĐỘ: ${{ github.event.inputs.severity_level || 'critical,high' }}"
          
          nuclei \
            -list targets.txt \
            -severity ${{ github.event.inputs.severity_level || 'critical,high' }} \
            -t /tmp/ultimate-templates/ \
            -t /tmp/ultimate-templates/geeknik/ \
            -t /tmp/ultimate-templates/extra/ \
            -t /tmp/ultimate-templates/random/ \
            -t /tmp/ultimate-templates/official/ \
            -c 300 \
            -bulk-size 200 \
            -rate-limit 0 \
            -timeout 20 \
            -retries 2 \
            -max-redirects 10 \
            -follow-redirects \
            -scan-all-ips \
            -pt http,https,dns,network,tcp,ssl,whois \
            -tags cve,kev,osint,exposure,wordpress,drupal,joomla,magento,opensource,aws,azure,gcp,cloud,apache,tomcat,nginx,iis,spring,laravel,django,rails,react,angular,vue,graphql,rest,soap,webcache,webmin \
            -exclude-tags "miscellaneous,takeover,panel,tech-detect,information-disclosure,header" \
            -show-match \
            -stats \
            -stats-interval 10 \
            -rdb report.db \
            -json-export results.json \
            -jle results.jsonl \
            -o results.txt \
            -no-interactsh \
            -disable-update-check \
            -max-host-error 50 \
            -verify \
            -silent \
            -no-mhe \
            -project \
            -project-path /tmp/nuclei-project \
            2>/dev/null || true
          
          echo "✅ HOÀN TẤT: $(date)"

      - name: 📊 THỐNG KÊ KẾT QUẢ
        run: |
          if [ ! -f results.json ]; then
            echo '{}' > results.json
            echo '[]' > results.jsonl
            touch results.txt
            exit 0
          fi
          
          CRITICAL=$(jq -r 'select(.info.severity=="critical")' results.json 2>/dev/null | wc -l)
          HIGH=$(jq -r 'select(.info.severity=="high")' results.json 2>/dev/null | wc -l)
          MEDIUM=$(jq -r 'select(.info.severity=="medium")' results.json 2>/dev/null | wc -l)
          LOW=$(jq -r 'select(.info.severity=="low")' results.json 2>/dev/null | wc -l)
          INFO=$(jq -r 'select(.info.severity=="info")' results.json 2>/dev/null | wc -l)
          TOTAL=$(cat results.txt 2>/dev/null | wc -l)
          
          echo "=================================================="
          echo "📊 KẾT QUẢ QUÉT"
          echo "=================================================="
          echo "🔥 CRITICAL: $CRITICAL"
          echo "⚡ HIGH: $HIGH"
          echo "🟡 MEDIUM: $MEDIUM"
          echo "🟢 LOW: $LOW"
          echo "ℹ️ INFO: $INFO"
          echo "📦 TỔNG: $TOTAL"
          echo "=================================================="
          
          echo ""
          echo "🔥 CRITICAL:"
          jq -r 'select(.info.severity=="critical") | "[🔥] " + .info.name + " → " + .matched-at' results.json 2>/dev/null | head -20
          
          echo ""
          echo "⚡ HIGH:"
          jq -r 'select(.info.severity=="high") | "[⚡] " + .info.name + " → " + .matched-at' results.json 2>/dev/null | head -20

      - name: 📄 TẠO BÁO CÁO HTML
        if: always()
        run: |
          cat > report.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Nuclei Scan Report</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;min-height:100vh;padding:20px;color:#e0e0e0}
              .container{max-width:1400px;margin:0 auto;background:rgba(255,255,255,0.03);border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,0.1)}
              .header{text-align:center;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:20px;margin-bottom:30px}
              .header h1{font-size:28px;color:#00d4ff}
              .header .sub{font-size:14px;opacity:0.5;margin-top:5px}
              .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:30px}
              .stat-card{background:rgba(255,255,255,0.05);border-radius:12px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,0.08)}
              .stat-number{font-size:32px;font-weight:bold}
              .stat-label{font-size:12px;opacity:0.7;margin-top:5px}
              .critical{color:#ff4444}
              .high{color:#ff8800}
              .medium{color:#ffcc00}
              .low{color:#44ccff}
              .info{color:#8888ff}
              .total{color:#fff}
              table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.02);border-radius:12px;overflow:hidden;margin-top:20px}
              th,td{padding:12px 15px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05)}
              th{background:rgba(0,212,255,0.1);color:#00d4ff;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:1px}
              tr:hover{background:rgba(255,255,255,0.03)}
              .sev-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:bold;text-transform:uppercase}
              .sev-critical{background:#ff4444;color:#fff}
              .sev-high{background:#ff8800;color:#fff}
              .sev-medium{background:#ffcc00;color:#000}
              .sev-low{background:#44ccff;color:#000}
              .sev-info{background:#8888ff;color:#fff}
              .footer{margin-top:30px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.05);text-align:center;font-size:11px;opacity:0.4}
              .loading{text-align:center;padding:40px;color:#8888ff}
              .empty{text-align:center;padding:30px;opacity:0.5}
            </style>
          </head>
          <body>
          <div class="container">
            <div class="header">
              <h1>🔍 NUCLEI SCAN REPORT</h1>
              <div class="sub">Generated by GitHub Actions</div>
            </div>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-number critical" id="critical">...</div><div class="stat-label">CRITICAL</div></div>
              <div class="stat-card"><div class="stat-number high" id="high">...</div><div class="stat-label">HIGH</div></div>
              <div class="stat-card"><div class="stat-number medium" id="medium">...</div><div class="stat-label">MEDIUM</div></div>
              <div class="stat-card"><div class="stat-number low" id="low">...</div><div class="stat-label">LOW</div></div>
              <div class="stat-card"><div class="stat-number info" id="info">...</div><div class="stat-label">INFO</div></div>
              <div class="stat-card"><div class="stat-number total" id="total">...</div><div class="stat-label">TOTAL</div></div>
            </div>
            <h3>🔥 CRITICAL & HIGH</h3>
            <div id="table-container"><div class="loading">⏳ LOADING...</div></div>
            <div class="footer">Nuclei Ultimate Scan • All rights reserved</div>
          </div>
          <script>
            fetch('results.json')
              .then(res => res.json())
              .then(data => {
                const sev = {critical:[], high:[], medium:[], low:[], info:[]};
                if (Array.isArray(data)) {
                  data.forEach(item => {
                    if (item.info && sev[item.info.severity]) sev[item.info.severity].push(item);
                  });
                }
                document.getElementById('critical').textContent = sev.critical.length;
                document.getElementById('high').textContent = sev.high.length;
                document.getElementById('medium').textContent = sev.medium.length;
                document.getElementById('low').textContent = sev.low.length;
                document.getElementById('info').textContent = sev.info.length;
                const total = sev.critical.length + sev.high.length + sev.medium.length + sev.low.length + sev.info.length;
                document.getElementById('total').textContent = total;
                const container = document.getElementById('table-container');
                const items = [...sev.critical, ...sev.high];
                if (items.length === 0) {
                  container.innerHTML = '<div class="empty">💎 No critical or high vulnerabilities found</div>';
                  return;
                }
                let html = '<table><tr><th>SEVERITY</th><th>NAME</th><th>URL</th></tr>';
                items.forEach(item => {
                  const badge = `<span class="sev-badge sev-${item.info.severity}">${item.info.severity.toUpperCase()}</span>`;
                  const url = item.matchedAt || item['matched-at'] || 'N/A';
                  html += `<tr><td>${badge}</td><td><strong>${item.info.name}</strong></td><td style="font-size:12px;opacity:0.8;">${url}</td></tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
              })
              .catch(err => {
                document.getElementById('table-container').innerHTML = `<div class="empty">❌ Error loading results: ${err.message}</div>`;
              });
          </script>
          </body>
          </html>
          EOF

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-scan-report-${{ github.run_id }}
          path: |
            results.txt
            results.json
            results.jsonl
            report.html
            report.db
            targets.txt
            /tmp/nuclei-project/
          retention-days: 30
