name: Nuclei 24/7 Auto Scan

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@v3
        with:
          version: latest
          args: >
            -l targets.txt
            -severity critical,high,medium,low,info,unknown
            -rl 150
            -c 50
            -bs 25
            -timeout 10
            -retries 2
            -stats
            -json-export nuclei-results.json
            -sarif-export nuclei-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nuclei-results.sarif
          category: nuclei-results

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.json
          retention-days: 30
